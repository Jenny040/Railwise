spring.application.name=railwise-backend

# --- Database (Postgres) ---
# For local dev, create a db first: createdb railwise
spring.datasource.url=jdbc:postgresql://localhost:5432/railwise
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
